name: Live data smoke test

# Hits the real CoinGecko, alternative.me and Binance APIs through the app's own
# parsing code. Binance futures is region-blocked on GitHub's US runners, so
# those checks report "skipped: region-blocked" here; run them locally with
#   cd backend && LIVE_TESTS=1 pytest tests/test_live.py -v
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths:
      - backend/app/market_data.py
      - backend/app/market_metrics.py
      - backend/app/derivatives.py
      - backend/app/stream_hub.py
      - backend/tests/test_live.py

jobs:
  live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: LIVE_TESTS=1 pytest tests/test_live.py -v -rs
