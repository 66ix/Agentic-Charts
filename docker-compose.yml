# One-command deploy on a VPS (see README "Deploy"):
#   PUBLIC_ORIGIN=https://charts.example.com PUBLIC_API_URL=https://charts.example.com docker compose up -d --build
# Ports are bound to 127.0.0.1 for a TLS reverse proxy on the same host (Caddy, nginx). To reach them
# directly instead, set BIND=0.0.0.0 and TRUST_PROXY=0, or clients could fake their IP to the rate limiter.
services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      AGENT_RATE_LIMIT: ${AGENT_RATE_LIMIT:-20/minute}
      AGENT_DAILY_LIMIT: ${AGENT_DAILY_LIMIT:-500}
      # Ollama installed on the host machine (uses its GPU). With the ollama profile below, set OLLAMA_URL=http://ollama:11434.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Docker Desktop has this name already; Linux needs the mapping
    volumes:
      - backend-cache:/app/.cache
    ports:
      - "${BIND:-127.0.0.1}:8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "${BIND:-127.0.0.1}:3000:3000"
    restart: unless-stopped

  # Optional model in Docker (CPU only): OLLAMA_URL=http://ollama:11434 docker compose --profile ollama up -d, then
  # docker compose exec ollama ollama pull llama3.1:8b
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  backend-cache:
  ollama:
